name: zombie-survival-server

services:
  mysql:
    image: mysql:8.4.10
    container_name: game-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - backend

  app:
    image: ${APP_IMAGE:-zombie-survival-server:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: game-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: 8080
      Database__Host: mysql
      Database__Port: 3306
      Database__Name: ${MYSQL_DATABASE}
      Database__User: ${MYSQL_USER}
      Database__Credential: ${MYSQL_PASSWORD}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      SmtpEmail__Host: ${SMTP_HOST:?SMTP_HOST is required}
      SmtpEmail__Port: ${SMTP_PORT:-587}
      SmtpEmail__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      SmtpEmail__UserName: ${SMTP_USERNAME:?SMTP_USERNAME is required}
      SmtpEmail__Password: ${SMTP_PASSWORD:-}
      SmtpEmail__FromAddress: ${SMTP_FROM_ADDRESS:?SMTP_FROM_ADDRESS is required}
      SmtpEmail__FromName: ${SMTP_FROM_NAME:-Zombie Survival}
      TZ: UTC
    ports:
      - "${APP_HOST_PORT:-5000}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - backend

  backup:
    profiles: ["backup"]
    image: ${BACKUP_IMAGE:-zombie-survival-mysql-backup:local}
    build:
      context: deployment/backup
      dockerfile: Dockerfile
    container_name: game-mysql-backup
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_BACKUP_S3_URI: ${MYSQL_BACKUP_S3_URI:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_DEFAULT_REGION: ${AWS_REGION:-}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      TZ: UTC
    volumes:
      - backup_tmp:/backups
    networks:
      - backend

volumes:
  mysql_data:
    name: zombie_survival_mysql_data
  backup_tmp:
    name: zombie_survival_mysql_backup_tmp

networks:
  backend:
    name: zombie_survival_backend
