name: CD

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  publish:
    name: Publish container images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      app_image: ${{ steps.images.outputs.app_image }}
      backup_image: ${{ steps.images.outputs.backup_image }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Resolve image names and tags
        id: images
        shell: bash
        run: |
          image_root="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            channel_tag="latest"
          else
            channel_tag="develop"
          fi

          echo "app_image=${image_root}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "backup_image=${image_root}-mysql-backup:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "app_tags=${image_root}:${GITHUB_SHA},${image_root}:${channel_tag}" >> "$GITHUB_OUTPUT"
          echo "backup_tags=${image_root}-mysql-backup:${GITHUB_SHA},${image_root}-mysql-backup:${channel_tag}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.app_tags }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push backup image
        uses: docker/build-push-action@v6
        with:
          context: deployment/backup
          file: deployment/backup/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.backup_tags }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

  deploy:
    name: Deploy to Linux host
    needs: publish
    if: vars.SSH_DEPLOY_ENABLED == 'true' && (github.ref_name == 'main' || vars.DEVELOP_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      DEPLOY_APP_IMAGE: ${{ needs.publish.outputs.app_image }}
      DEPLOY_BACKUP_IMAGE: ${{ needs.publish.outputs.backup_image }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Upload deployment files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: compose.yaml,deployment
          target: ~/zombie-survival-server

      - name: Deploy app with health rollback
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_APP_IMAGE,DEPLOY_BACKUP_IMAGE,GHCR_USERNAME,GHCR_PAT
          script: |
            cd ~/zombie-survival-server
            bash deployment/scripts/deploy.sh
