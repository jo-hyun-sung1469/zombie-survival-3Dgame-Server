name: Development CD

on:
  push:
    branches: [develop, release]
  pull_request:
    branches: [develop, release]

permissions:
  contents: read

jobs:
  deployment-validation:
    name: Validate disposable deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: development-deployment-validation-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      MYSQL_DATABASE: zombie_survival_ci
      MYSQL_USER: zombie_ci
      MYSQL_PASSWORD: development-ci-mysql-password
      MYSQL_ROOT_PASSWORD: development-ci-root-password
      DATABASE_SSL_MODE: Disabled
      JWT_SECRET_KEY: development_ci_jwt_secret_key_0123456789abcdef
      SMTP_HOST: smtp.example.invalid
      SMTP_PORT: 587
      SMTP_ENABLE_SSL: true
      SMTP_USERNAME: development-ci
      SMTP_PASSWORD: development-ci-smtp-password
      SMTP_FROM_ADDRESS: development-ci@example.invalid
      SMTP_FROM_NAME: Zombie Survival CI
      ASPNETCORE_ENVIRONMENT: Production
      APP_HOST_PORT: 5000
      APP_SCHEME: http
      APP_DOMAIN: localhost
      APP_IMAGE: zombie-survival-server:deployment-validation
      BACKUP_IMAGE: zombie-survival-mysql-backup:deployment-validation

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        run: docker compose --env-file app.env.example config --quiet

      - name: Build deployment images
        run: docker compose --env-file app.env.example build app backup

      - name: Start disposable deployment
        run: docker compose --env-file app.env.example up --detach --wait --wait-timeout 180 mysql app caddy

      - name: Verify application health endpoint
        run: |
          docker compose --env-file app.env.example ps
          curl --fail --silent --show-error --retry 5 --retry-delay 2 http://127.0.0.1:5000/health
          curl --fail --silent --show-error --retry 5 --retry-delay 2 http://127.0.0.1:5000/live
          curl --fail --silent --show-error --retry 5 --retry-delay 2 http://localhost/live
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost/health)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost/health/)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost/Health)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost/HEALTH/)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost/health%2F)" = "404"

      - name: Print deployment logs on failure
        if: failure()
        run: docker compose --env-file app.env.example logs --no-color --tail 200 mysql app caddy

      - name: Remove disposable deployment
        if: always()
        run: docker compose --env-file app.env.example down --volumes --remove-orphans
